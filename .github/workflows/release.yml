name: Release

# A release happens ONLY when a version tag (e.g. v0.1.1) is pushed.
# Normal pushes to main no longer build or publish anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libxdo-dev

      - run: npm ci

      - name: Sync version to tauri.conf.json
        run: node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));c.version='${{ github.ref_name }}'.replace(/^v/,'');fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(c,null,2)+'\n');"

      # Pull this version's section out of changelog.md so it becomes both the
      # GitHub release body AND the `notes` field of latest.json — which the app
      # shows in its update banner ("What's new").
      - name: Extract release notes from changelog
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG;
            const md = fs.readFileSync("changelog.md", "utf8").replace(/\r/g, "");
            const lines = md.split("\n");
            const start = lines.findIndex((l) => l.startsWith("## [" + tag + "]"));
            let section = [];
            if (start !== -1) {
              const rest = lines.slice(start + 1);
              const end = rest.findIndex((l) => l.startsWith("## ["));
              section = end === -1 ? rest : rest.slice(0, end);
              while (section.length && (section[section.length - 1].trim() === "" || section[section.length - 1].trim() === "---")) section.pop();
            }
            const body = section.join("\n").trim() || "See the changelog for details.";
            fs.writeFileSync("RELEASE_NOTES.md", body + "\n");
          '
          echo "Extracted notes:"
          cat RELEASE_NOTES.md
          {
            echo "body<<__WARID_NOTES__"
            cat RELEASE_NOTES.md
            echo "__WARID_NOTES__"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Warid ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Only flips the draft release to public if every platform build above succeeded.
  # If a build fails, the release stays a hidden draft and never reaches users.
  publish-release:
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ github.ref_name }}';
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find(r => r.tag_name === tag);
            if (!release) {
              throw new Error(`No release found for tag ${tag}`);
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
            });
